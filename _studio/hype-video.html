<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#f7efe0;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
// hong.fun 10s hype — paper, vermilion, gold. 红 stamps in → tape strip → "paired to a Chinese stock" → index math → red envelopes → CTA.
const W = 1280, H = 720, cv = document.getElementById('c'), g = cv.getContext('2d');
const PAPER = '#f7efe0', INK = '#1c1410', INK2 = '#5a4a3a', INK3 = '#9a8a76', RED = '#c8102e', GOLD = '#c99a2e', GREEN = '#1f7a4d';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)); const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = (k) => 1 - Math.pow(1 - k, 3); const io = (t, a, b, f = .3) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
function txt(s, x, y, size, color, weight = 700, align = 'center', font = 'Noto Serif SC', ls = 0) { g.font = `${weight} ${size}px '${font}'`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.letterSpacing = '0px'; }
function bg() { g.fillStyle = PAPER; g.fillRect(0, 0, W, H); g.fillStyle = 'rgba(200,16,46,.05)'; for (let y = 10; y < H; y += 18) for (let x = 10; x < W; x += 18) { g.beginPath(); g.arc(x, y, 1, 0, 6.28); g.fill(); } g.fillStyle = RED; g.fillRect(0, 0, W, 12); g.fillStyle = GOLD; g.fillRect(0, H - 6, W, 6); }
function zi(x, y, size, a, rot = 0) { g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px 'Noto Serif SC'`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = 'rgba(201,154,46,.35)'; g.fillText('红', size * .05, size * .05); g.fillStyle = RED; g.fillText('红', 0, 0); g.restore(); }
function seal(x, y, s, label, a, rot = -.12) { g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(rot); g.strokeStyle = '#b3121f'; g.lineWidth = 4; g.fillStyle = 'rgba(179,18,31,.06)'; g.fillRect(-s / 2, -s / 2, s, s); g.strokeRect(-s / 2, -s / 2, s, s); g.lineWidth = 2; g.strokeRect(-s / 2 + 7, -s / 2 + 7, s - 14, s - 14); txt(label, 0, 2, s * .42, '#b3121f', 900); g.restore(); }
const TAPE = [['腾讯', '438.80', '+1.2%', 1], ['比亚迪', '79.05', '+3.1%', 1], ['贵州茅台', '1272.75', '+0.6%', 1], ['阿里巴巴', '107.20', '-0.4%', 0], ['宁德时代', '316.36', '+2.4%', 1], ['小米', '26.50', '-2.4%', 0], ['拼多多', '78.08', '+0.9%', 1]];
function strip(y, t, a) { g.save(); g.globalAlpha = a; g.fillStyle = INK; g.fillRect(0, y, W, 44); g.font = "500 15px 'IBM Plex Mono'"; g.textBaseline = 'middle'; let x = -((t * 90) % 1400); for (let r = 0; r < 3; r++) for (const s of TAPE) { g.textAlign = 'left'; g.fillStyle = PAPER; g.fillText(s[0], x + 14, y + 22); const w1 = g.measureText(s[0]).width; g.fillStyle = s[3] ? '#ff5a6e' : '#4ed08a'; g.fillText(s[1] + ' ' + s[2], x + 22 + w1, y + 22); x += 200; g.fillStyle = '#3a2e24'; g.fillRect(x - 8, y + 8, 1, 28); } g.restore(); }
function card(x, y, w, h, a) { g.save(); g.globalAlpha = a; g.fillStyle = '#fffaf0'; g.strokeStyle = '#d9c9a8'; g.lineWidth = 2; g.fillRect(x, y, w, h); g.strokeRect(x, y, w, h); g.fillStyle = RED; g.fillRect(x, y, w, 5); g.restore(); }
function env(x, y, w, h, a, k) { g.save(); g.globalAlpha = a; g.translate(x, y); const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, '#d8142f'); grd.addColorStop(1, '#a60d25'); g.fillStyle = grd; g.fillRect(-w / 2, -h / 2, w, h); g.strokeStyle = GOLD; g.lineWidth = 3; g.strokeRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12); g.fillStyle = '#ffd77a'; g.beginPath(); g.moveTo(-w / 2, -h / 2); g.lineTo(w / 2, -h / 2); g.lineTo(0, -h / 2 + h * .38 * k); g.closePath(); g.fill(); txt('红包', 0, h * .12, h * .3, '#ffe9a8', 900); g.restore(); }
window.__seek = function (t) {
  bg(); strip(H - 50, t, t < 9 ? 1 : 1 - seg(t, 9, 10));
  if (t < 2.0) { const a = io(t, 0, 2.0); const k = ease(seg(t, .05, .6)); zi(W / 2, 290, 300 * k, a); seal(W / 2 + 180, 400, 90, 'fun', a * seg(t, .7, 1.0)); g.globalAlpha = a * seg(t, 1.0, 1.3); txt('hong.fun', W / 2, 520, 44, INK, 600, 'center', 'IBM Plex Mono'); txt('THE CHINESE-STOCK LAUNCHPAD · ROBINHOOD CHAIN', W / 2, 570, 13, INK3, 600, 'center', 'IBM Plex Mono', 3); g.globalAlpha = 1; }
  if (t >= 1.9 && t < 4.0) { const a = io(t, 1.9, 4.0); zi(1080, 330, 420, a * .9); g.globalAlpha = a; txt('Every coin paired to', 90, 240, 66, INK, 900, 'left'); txt('a Chinese stock.', 90, 320, 66, RED, 900, 'left'); txt('Tencent · BYD · Moutai · CATL · Alibaba · NIO', 90, 400, 22, INK2, 500, 'left', 'Noto Sans SC'); txt('HKEX · SSE · SZSE · US ADRs', 90, 440, 13, INK3, 600, 'left', 'IBM Plex Mono', 3); g.globalAlpha = 1; }
  if (t >= 3.9 && t < 6.2) { const a = io(t, 3.9, 6.2); g.globalAlpha = a; txt('price = curve × (stock ÷ base)', W / 2, 170, 48, INK, 900); g.globalAlpha = 1; const k = ease(seg(t, 4.3, 5.6)); const idx = 1 + .031 * k; card(190, 240, 900, 200, a); g.globalAlpha = a; txt('比亚迪 · BYD · 1211.HK', 220, 290, 22, INK3, 600, 'left', 'IBM Plex Mono'); txt((79.05 * idx).toFixed(2) + ' HKD', 220, 350, 52, k > .05 ? RED : INK, 600, 'left', 'IBM Plex Mono'); txt('index ' + idx.toFixed(4) + '×', 640, 350, 52, RED, 600, 'left', 'IBM Plex Mono'); txt('your $BYD coin · whole curve · ' + (idx > 1 ? '+' : '') + ((idx - 1) * 100).toFixed(1) + '%', 220, 405, 20, INK2, 500, 'left', 'Noto Sans SC'); txt('demand moves the curve · the tape moves the multiplier', W / 2, 500, 13, INK3, 600, 'center', 'IBM Plex Mono', 3); g.globalAlpha = 1; }
  if (t >= 6.1 && t < 8.3) { const a = io(t, 6.1, 8.3); const k = ease(seg(t, 6.4, 7.2)); env(W / 2, 300, 260, 170, a, k); g.globalAlpha = a; txt('88 red envelopes', W / 2, 460, 54, INK, 900); txt('first 88 buyers · random bonus · every 8th gets 1.88×', W / 2, 515, 14, INK3, 600, 'center', 'IBM Plex Mono', 2); txt('1% fee · half burns $HONG', W / 2, 560, 22, RED, 700, 'center', 'Noto Sans SC'); g.globalAlpha = 1; }
  if (t >= 8.2) { const a = seg(t, 8.2, 8.6); bg(); strip(H - 50, t, 1 - seg(t, 9, 10)); zi(W / 2, 250, 260, a); g.globalAlpha = a; txt('hongfun.xyz', W / 2, 450, 46, INK, 600, 'center', 'IBM Plex Mono'); txt('RED IS UP · $HONG · ROBINHOOD CHAIN', W / 2, 505, 13, RED, 600, 'center', 'IBM Plex Mono', 4); g.globalAlpha = 1; seal(W / 2 + 210, 250, 84, '上市', a, .1); }
  return true;
};
window.__ready = document.fonts.ready.then(() => { __seek(0); return true; });
</script></body></html>
